<svg width="980" height="260" viewBox="0 0 980 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI application stack diagram">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#171B3A"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="130" x2="900" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <style>
      .node { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.18); }
      .label { fill: #F8FAFC; font: 700 20px 'Segoe UI', Arial, sans-serif; }
      .sub { fill: #A5B4FC; font: 500 13px 'Segoe UI', Arial, sans-serif; }
      .flow { stroke: url(#line); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 22 16; animation: move 10s linear infinite; }
      .spark { animation: blink 1.8s ease-in-out infinite; }
      @keyframes move { to { stroke-dashoffset: -260; } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="980" height="260" rx="24" fill="url(#card)"/>
  <path class="flow" d="M130 130H850"/>

  <g transform="translate(54 70)">
    <rect class="node" width="160" height="120" rx="22"/>
    <text class="label" x="80" y="48" text-anchor="middle">Frontend</text>
    <text class="sub" x="80" y="78" text-anchor="middle">Vue 3 / TS / Vite</text>
  </g>
  <g transform="translate(284 70)">
    <rect class="node" width="160" height="120" rx="22"/>
    <text class="label" x="80" y="48" text-anchor="middle">Backend</text>
    <text class="sub" x="80" y="78" text-anchor="middle">Node.js / API</text>
  </g>
  <g transform="translate(514 70)">
    <rect class="node" width="160" height="120" rx="22"/>
    <text class="label" x="80" y="48" text-anchor="middle">AI</text>
    <text class="sub" x="80" y="78" text-anchor="middle">RAG / Tools</text>
  </g>
  <g transform="translate(744 70)">
    <rect class="node" width="160" height="120" rx="22"/>
    <text class="label" x="80" y="48" text-anchor="middle">Deploy</text>
    <text class="sub" x="80" y="78" text-anchor="middle">Supabase / Netlify</text>
  </g>

  <circle class="spark" cx="130" cy="130" r="7" fill="#00D9FF"/>
  <circle class="spark" cx="360" cy="130" r="7" fill="#7C3AED" style="animation-delay:-.4s"/>
  <circle class="spark" cx="590" cy="130" r="7" fill="#A78BFA" style="animation-delay:-.8s"/>
  <circle class="spark" cx="820" cy="130" r="7" fill="#22C55E" style="animation-delay:-1.2s"/>
</svg>
